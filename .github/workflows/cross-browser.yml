name: Cross-browser checks

# Runs on pushes to check/* branches and by hand. Builds the static site,
# serves it inside the runner and checks key pages in Chromium, Firefox,
# WebKit and two emulated phone profiles. Does not deploy anything.
on:
  push:
    branches: ['check/**']
    paths-ignore: ['README.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bunx playwright test -c playwright.cross-browser.config.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
