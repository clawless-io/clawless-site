name: Cross-browser checks

# Runs once per release candidate: on a push to the pre-release branch, or by
# hand. Builds the static site, serves it inside the runner and checks key
# pages in Chromium, Firefox, WebKit and two emulated phone profiles on Linux,
# then in Playwright's WebKit on macOS (this is not Safari.app). The macOS job
# starts only after the Linux job passes. Both jobs run only in a private
# repository, so test logs and screenshots are never public. Does not deploy.
on:
  push:
    branches: [pre-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bunx playwright test -c playwright.cross-browser.config.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  macos:
    needs: linux
    if: ${{ github.event.repository.private == true }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install webkit
      - run: bunx playwright test -c playwright.cross-browser.config.ts --project=webkit --project=iphone
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-macos-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
